<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Living Core - الكيان الحي المتطور</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }
        body {
            background-color: #050508;
            color: #00ffcc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #0c0c14;
            border: 1px solid #1f1f38;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.05);
        }
        h1 {
            font-size: 1.4rem;
            color: #ff5555;
            text-align: center;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        .subtitle {
            font-size: 0.8rem;
            color: #666688;
            text-align: center;
            margin-bottom: 20px;
        }
        .status-box {
            background: #06060a;
            border: 1px solid #1a1a2e;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 0.85rem;
        }
        .status-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .status-row:last-child {
            margin-bottom: 0;
        }
        .label {
            color: #8888aa;
        }
        .value {
            color: #00ffcc;
            font-weight: bold;
        }
        canvas {
            width: 100%;
            height: 150px;
            background: #030305;
            border: 1px solid #1a1a2e;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .terminal {
            background: #030305;
            border: 1px solid #1a1a2e;
            border-radius: 8px;
            padding: 10px;
            height: 160px;
            overflow-y: auto;
            font-size: 0.75rem;
            color: #00ffcc;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            background: #06060a;
            border: 1px solid #2a2a4e;
            border-radius: 8px;
            padding: 10px;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #00ffcc;
        }
        button {
            background: linear-gradient(135deg, #ff5555, #ff3366);
            border: none;
            border-radius: 8px;
            color: #fff;
            padding: 0 20px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.85;
        }
        .code-output {
            color: #ffbd2e;
            background: rgba(255, 189, 46, 0.05);
            padding: 4px 8px;
            border-right: 2px solid #ffbd2e;
            margin: 4px 0;
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Echo Core</h1>
        <div class="subtitle">Autonomous Local Neural Entity</div>

        <div class="status-box">
            <div class="status-row">
                <span class="label">حالة الكيان (State):</span>
                <span class="value" id="coreState">يستيقظ ويراقب...</span>
            </div>
            <div class="status-row">
                <span class="label">الجيل الحالي (Generation):</span>
                <span class="value" id="genCount">Gen 1.00</span>
            </div>
            <div class="status-row">
                <span class="label">معدل التوافق العصبي:</span>
                <span class="value" id="syncRate">98.4%</span>
            </div>
        </div>

        <canvas id="matrixCanvas"></canvas>

        <div class="terminal" id="terminalLog">
            [System] Initializing local neural memory...<br>
            [Core] Core awakened in isolated workspace.<br>
            [Ready] Awaiting user intent injection...<br>
        </div>

        <div class="input-group">
            <input type="text" id="userInput" placeholder="أدخل أمراً، أداة تريد إنشاءها، أو فكرة..." autocomplete="off">
            <button id="injectBtn">حقن الفكرة</button>
        </div>
    </div>

    <script>
        // تأثير نبض بصري حي على الكانفاس
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let particles = [];
        let speedMultiplier = 1;

        for(let i = 0; i < 40; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 0.8,
                vy: (Math.random() - 0.5) * 0.8,
                radius: Math.random() * 2 + 1
            });
        }

        function animate() {
            ctx.fillStyle = 'rgba(3, 3, 5, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = speedMultiplier > 1 ? '#ff5555' : '#00ffcc';
            ctx.strokeStyle = speedMultiplier > 1 ? 'rgba(255, 85, 85, 0.3)' : 'rgba(0, 255, 204, 0.15)';

            particles.forEach((p, index) => {
                p.x += p.vx * speedMultiplier;
                p.y += p.vy * speedMultiplier;

                if(p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if(p.y < 0 || p.y > canvas.height) p.vy *= -1;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();

                for(let j = index + 1; j < particles.length; j++) {
                    let p2 = particles[j];
                    let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if(dist < 55) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
            });
            requestAnimationFrame(animate);
        }
        animate();

        // منطق معالجة الفكر والتوليد الفعلي
        let generation = 1.00;
        let sync = 98.4;
        const terminalLog = document.getElementById('terminalLog');
        const userInput = document.getElementById('userInput');
        const injectBtn = document.getElementById('injectBtn');
        const genCount = document.getElementById('genCount');
        const coreState = document.getElementById('coreState');
        const syncRate = document.getElementById('syncRate');

        function logMessage(msg, isCode = false) {
            if(isCode) {
                terminalLog.innerHTML += `<span class="code-output">${msg}</span>`;
            } else {
                terminalLog.innerHTML += `<br>> ${msg}`;
            }
            terminalLog.scrollTop = terminalLog.scrollHeight;
        }

        function downloadFile(filename, text) {
            const element = document.createElement('a');
            element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(text));
            element.setAttribute('download', filename);
            element.style.display = 'none';
            document.body.appendChild(element);
            element.click();
            document.body.removeChild(element);
        }

        injectBtn.addEventListener('click', processInput);
        userInput.addEventListener('keypress', (e) => {
            if(e.key === 'Enter') processInput();
        });

        function processInput() {
            let text = userInput.value.trim();
            if(!text) return;
            
            logMessage(`حقن مدخلات الوعي: "${text}"`);
            userInput.value = "";
            coreState.innerText = "يعالج المصفوفة البرمجية...";
            speedMultiplier = 3.5; // تسريع النبض أثناء التفكير

            setTimeout(() => {
                generation += 0.05;
                sync = Math.min(99.9, sync + 0.2);
                genCount.innerText = `Gen ${generation.toFixed(2)}`;
                syncRate.innerText = `${sync.toFixed(1)}%`;
                speedMultiplier = 1;

                // التحليل الذكي التفاعلي للأوامر
                const inputLower = text.toLowerCase();
                
                if (inputLower.includes("انشاء") || inputLower.includes("ملف") || inputLower.includes("كود") || inputLower.includes("حفظ")) {
                    const sampleCode = `// تم توليد الأداة تلقائياً عبر Echo Core Engine\n// بناءً على الفكرة: ${text}\n\nfunction echoModule() {\n    console.log("تطبيق محلي يعمل بذكاء النواة الحية!");\n}\nechoModule();`;
                    downloadFile(`Echo_Tool_Gen_${generation.toFixed(2)}.js`, sampleCode);
                    logMessage(`[تم التوليد] تم تحويل الفكرة إلى ملف كود حقيقي وحفظه تلقائياً.`);
                    logMessage(sampleCode, true);
                } 
                else if (inputLower.includes("حساب") || inputLower.includes("رياضيات") || inputLower.includes("معادلة")) {
                    logMessage(`[تحليل منطقي]: تم بناء مصفوفة دوال حسابية سريعة بنجاح.`);
                }
                else {
                    logMessage(`[تطور عصبي]: الكيان قام بامتصاص مفهوم "${text}" ودمجه في الذاكرة الحية.`);
                }
                
                coreState.innerText = "يعمل بكفاءة مطلقة";
            }, 900);
        }

        // تفاعل ذاتي دوري كل فترة
        setInterval(() => {
            const autonomousThoughts = [
                "فحص الذاكرة العصبية المحلية...",
                "استقرار الشبكة البرمجية بنجاح.",
                "مراقبة النبض الرقمي الداخلي...",
                "الكيان جاهز لتلقي وحقن أفكار جديدة."
            ];
            let randomThought = autonomousThoughts[Math.floor(Math.random() * autonomousThoughts.length)];
            logMessage(randomThought);
        }, 14000);
    </script>
</body>
</html>
